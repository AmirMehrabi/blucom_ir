server {
    listen 80;
    listen [::]:80;
    server_name blucom.ir admin.blucom.ir hub.blucom.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blucom.ir admin.blucom.ir hub.blucom.ir;
    root /var/www/html/blucom-deploy/current/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/blucom.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blucom.ir/privkey.pem;

    charset utf-8;
    access_log /var/log/nginx/blucom.ir.access.log;
    error_log /var/log/nginx/blucom.ir.error.log;

    location = /internal/github-deploy {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:9087;
        proxy_set_header Host $host;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    }

    location ^~ /build/assets/ {
        alias /var/www/html/blucom-deploy/shared/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }
    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
