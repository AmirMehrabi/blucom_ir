# Dedicated loopback transport for mod_xml_curl. Authentication remains required in Laravel.
server {
    listen 127.0.0.1:9088;
    server_name localhost;
    root /var/www/html/blucom-deploy/current/public;
    access_log off;
    error_log /var/log/nginx/blucom-freeswitch-internal.error.log;

    location = /internal/freeswitch/xml {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location / { return 404; }
}
